<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js 已就绪</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #e6d6c1; }
      canvas { display: block; }
      .hud {
        position: fixed;
        left: 24px;
        bottom: 24px;
        color: #3b2f25;
        font-family: "Segoe UI", system-ui, sans-serif;
        pointer-events: none;
        user-select: none;
      }
      .hud h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
      .hud p { margin-top: 6px; font-size: 13px; color: #7a6552; }
      .importer {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        padding: 14px;
        border: 1px solid rgba(120, 91, 61, 0.22);
        border-radius: 14px;
        background: rgba(250, 243, 232, 0.86);
        box-shadow: 0 12px 40px rgba(91, 67, 44, 0.18);
        backdrop-filter: blur(14px);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .importer-actions { display: flex; gap: 8px; }
      .importer-actions { flex-wrap: wrap; justify-content: flex-end; }
      .importer button {
        padding: 9px 14px;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(135deg, #b08963, #8f6a48);
        color: #fff;
        font: 600 13px/1 "Segoe UI", system-ui, sans-serif;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.15s ease;
      }
      .importer button:hover { filter: brightness(1.12); }
      .importer button:active { transform: translateY(1px); }
      .importer button.secondary {
        background: rgba(78, 57, 38, 0.08);
        color: #5c4632;
      }
      #import-status {
        max-width: 280px;
        color: #7b6652;
        font-size: 12px;
        line-height: 1.5;
        text-align: right;
        word-break: break-all;
      }
      #import-status.error { color: #b4543f; }
      .drop-hint {
        position: fixed;
        inset: 12px;
        display: none;
        align-items: center;
        justify-content: center;
        border: 2px dashed rgba(143, 106, 72, 0.7);
        border-radius: 18px;
        background: rgba(245, 236, 222, 0.88);
        color: #4a3828;
        font: 600 20px/1 "Segoe UI", system-ui, sans-serif;
        pointer-events: none;
        z-index: 10;
      }
      body.dragging .drop-hint { display: flex; }
    </style>
  </head>
  <body>
    <div class="hud">
      <h1>Three.js 已安装并运行</h1>
      <p id="hud-hint">拖动旋转 · 滚轮缩放</p>
    </div>
    <div class="importer">
      <div class="importer-actions">
        <button id="import-btn" type="button">导入 3D 模型</button>
        <button id="camera-btn" class="secondary" type="button" hidden>
          进入摄像机视角
        </button>
        <button id="reset-btn" class="secondary" type="button" hidden>恢复示例</button>
      </div>
      <p id="import-status">支持 .glb / .gltf，也可直接把模型拖进窗口</p>
      <input
        id="model-file"
        type="file"
        accept=".glb,.gltf,model/gltf-binary,model/gltf+json"
        hidden
      />
    </div>
    <div class="drop-hint">松开鼠标即可导入模型</div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
